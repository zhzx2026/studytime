# 测试包：每次推工作分支 → 主机测试 + 构建 APK → artifact + 预发布 Release `ci` 的资产。
# **不打 tag、不发正式 Release、不动 main**（转正规则见 VERSIONING.md）。
# ci 资产：update.json / studytime.apk（最近一次构建）+ update-<分支id>.json / studytime-<分支id>.apk（各分支坑位）
name: staging
on:
  workflow_dispatch:
  push:
    branches: ["arena/**", "staging/**", "dev/**"]
permissions:
  contents: write          # 往预发布 Release `ci` 传测试包
  checks: write            # 把日志写回 ci-diagnostics 检查（沙箱侧读不到 Actions 日志，靠它自查）
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: 版本格式门禁（VERSIONING.md）
        run: bash scripts/version.sh check

      - name: Host tests（与本地同一条命令）
        run: |
          set +e
          bash scripts/run_tests.sh > /tmp/t.log 2>&1; ec=$?
          cat /tmp/t.log
          if [ $ec -ne 0 ]; then
            grep -E "error:|FAIL|Exception|!!|未定义|没有源文件" /tmp/t.log | head -10 | cut -c1-380 \
              | while IFS= read -r l; do echo "::error::[tests] $l"; done
            exit $ec
          fi

      - name: Install Android SDK pieces
        run: |
          mkdir -p $RUNNER_TEMP/sdk/build-tools $RUNNER_TEMP/sdk/platforms
          curl -sSL -o bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q bt.zip -d btX && mv btX/android-14 $RUNNER_TEMP/sdk/build-tools/34.0.0
          curl -sSL -o p.zip https://dl.google.com/android/repository/platform-34-ext7_r02.zip
          unzip -q p.zip -d pX && mv pX/android-34 $RUNNER_TEMP/sdk/platforms/android-34

      - name: Restore keystore（有 Secret 用 Secret，没有就用仓库内测试钥匙）
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > studytime.keystore; echo "用 Secret 钥匙";
          else echo "::notice::未配置 Secret KEYSTORE_B64 → 使用 signing/debug.keystore（公开测试钥匙）"; fi

      - name: Build
        env:
          SDK_ROOT: "${{ runner.temp }}/sdk"
          KS_PASS: "${{ secrets.KS_PASS }}"
          GIT_BRANCH: "${{ github.ref_name }}"
        run: |
          set +e
          bash build.sh > /tmp/b.log 2>&1; ec=$?
          cat /tmp/b.log
          if [ $ec -ne 0 ]; then
            grep -E "error:|错误|Exception|✗" /tmp/b.log | head -12 | cut -c1-380 \
              | while IFS= read -r l; do echo "::error::[build] $l"; done
            exit $ec
          fi

      - name: Meta
        id: meta
        env: { GIT_BRANCH: "${{ github.ref_name }}" }
        run: |
          VER=$(grep -oE 'versionName="[^"]*"' AndroidManifest.xml | sed 's/versionName="//;s/"//')
          VC=$(grep -oE 'versionCode="[0-9]*"' AndroidManifest.xml | sed 's/[^0-9]//g')
          BID=$(bash scripts/branch_id.sh)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"; echo "vc=$VC" >> "$GITHUB_OUTPUT"; echo "bid=$BID" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: studytime-v${{ steps.meta.outputs.ver }}-${{ steps.meta.outputs.bid }}-r${{ github.run_number }}
          path: studytime-v${{ steps.meta.outputs.ver }}.apk
          retention-days: 30

      - name: 发布到预发布 Release `ci`
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          set -eo pipefail
          VER=${{ steps.meta.outputs.ver }}; BID=${{ steps.meta.outputs.bid }}
          BASE="https://github.com/${{ github.repository }}/releases/download/ci"
          mkdir -p dist
          cp "studytime-v$VER.apk" "dist/studytime-$BID.apk"
          cp "studytime-v$VER.apk" dist/studytime.apk
          bash scripts/make_update_json.sh "$BASE/studytime-$BID.apk" "dist/update-$BID.json"
          bash scripts/make_update_json.sh "$BASE/studytime.apk" dist/update.json
          if ! gh release view ci >/dev/null 2>&1; then
            gh release create ci --prerelease --title "测试包（ci）" \
              --notes "每次推工作分支由 CI 自动覆盖。根资产 = 最近一次构建；带分支 id 的 = 各分支坑位。正式版请看 Latest release。" \
              --target "${{ github.sha }}"
          fi
          gh release upload ci dist/studytime.apk dist/update.json "dist/studytime-$BID.apk" "dist/update-$BID.json" --clobber
          gh release view ci --json assets --jq '.assets[]|"\(.name)  \(.size)"'

      - name: 摘要
        run: |
          {
            echo "## 测试包 v${{ steps.meta.outputs.ver }}（code ${{ steps.meta.outputs.vc }}）· \`${{ steps.meta.outputs.bid }}\`"
            echo
            echo "- 直链：https://github.com/${{ github.repository }}/releases/download/ci/studytime-${{ steps.meta.outputs.bid }}.apk"
            echo "- 或本页底部 Artifacts（zip，解压得 apk）"
          } >> "$GITHUB_STEP_SUMMARY"

      # 沙箱里的助手读不到 Actions 日志下载域，把日志尾部写进一个 check-run：
      #   gh api repos/<repo>/commits/<sha>/check-runs --jq '.check_runs[]|select(.name=="ci-diagnostics")|.output.text'
      - name: 诊断写回 check-run
        if: always()
        env: { GH_TOKEN: "${{ github.token }}", STATUS: "${{ job.status }}" }
        run: |
          { echo "===== run_tests.sh ====="; cat /tmp/t.log 2>/dev/null || echo "(无)";
            echo; echo "===== build.sh ====="; cat /tmp/b.log 2>/dev/null || echo "(无)"; } > /tmp/diag.log
          tail -c 60000 /tmp/diag.log | iconv -f utf-8 -t utf-8 -c > /tmp/diag.trim || cp /tmp/diag.log /tmp/diag.trim
          python3 - <<'PY' > /tmp/body.json
          import json, os
          print(json.dumps({"name": "ci-diagnostics", "head_sha": os.environ["GITHUB_SHA"], "status": "completed",
                            "conclusion": "success" if os.environ["STATUS"] == "success" else "failure",
                            "output": {"title": "staging " + os.environ["STATUS"], "summary": "run_tests.sh + build.sh 日志尾部",
                                       "text": open("/tmp/diag.trim", encoding="utf-8", errors="replace").read()}}))
          PY
          gh api --method POST "/repos/${{ github.repository }}/check-runs" --input /tmp/body.json > /dev/null || true
